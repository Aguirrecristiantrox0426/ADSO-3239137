services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rent_tools}
      MYSQL_USER: ${DB_USERNAME:-rent_tools}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    volumes:
      - rent-tools-data:/var/lib/mysql
    healthcheck:
      test:  ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$${MYSQL_USER}", "--password=$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rent-tools]
  api:
    build: { context: ../api, dockerfile: ../infra/api.Dockerfile }
    working_dir: /var/www/html
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rent_tools}
      DB_USERNAME: ${DB_USERNAME:-rent_tools}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@renttools.test}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_ADVISOR_EMAIL: ${DEMO_ADVISOR_EMAIL:-asesor@renttools.test}
      DEMO_ADVISOR_PASSWORD: ${DEMO_ADVISOR_PASSWORD:-Asesor123!}
    depends_on:
      database: { condition: service_healthy }
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    networks: [rent-tools]
  app:
    build: { context: ../app, dockerfile: ../infra/app.Dockerfile }
    ports: ["4173:80"]
    depends_on: [api]
    networks: [rent-tools]
  page:
    image: nginx:1.27-alpine
    volumes: ["../page:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
    networks: [rent-tools]
volumes:
  rent-tools-data:
networks:
  rent-tools:
